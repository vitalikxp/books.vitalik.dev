      .spine { fill: #e5e6dc; }
      .icon { stroke: #60675d; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .text { fill: #60675d; font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; letter-spacing: -0.01em; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #20251e; }
        .border { stroke: #343c30; }
        .spine { fill: #282f25; }
        .icon { stroke: #b3b8ac; }
