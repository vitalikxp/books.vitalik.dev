  <path d="M 0 4 A 4 4 0 0 1 4 0 L 12 0 L 12 312 L 4 312 A 4 4 0 0 1 0 308 Z" class="spine"/>
  <!-- Minimalist open book emblem -->
  <g transform="translate(110, 142)">
    <path d="M -22 -10 C -12 -14 0 -8 0 -8 C 0 -8 12 -14 22 -10 L 22 18 C 12 14 0 20 0 20 C 0 20 -12 14 -22 18 Z" class="icon"/>
    <line x1="0" y1="-8" x2="0" y2="20" class="icon"/>
  </g>
  <text x="110" y="196" class="text">Нет обложки</text>
</svg>
